<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Latvian Pro Sync</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --text: #c9d1d9; --accent: #58a6ff; --sec: #3fb950; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; align-items: center; }
        #app { width: 100%; max-width: 400px; text-align: center; }
        .screen { display: none; animation: fadeIn 0.3s; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .btn { background: var(--card); border: 1px solid #30363d; color: var(--accent); padding: 18px; border-radius: 12px; width: 100%; font-size: 1.1rem; margin-bottom: 12px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn:active { transform: scale(0.97); background: #1c2128; }
        .btn-sec { color: var(--sec); border-color: #30363d; }
        .btn-dim { color: #8b949e; font-size: 0.9rem; padding: 12px; }
        
        input { width: 100%; padding: 16px; margin-bottom: 12px; border-radius: 10px; border: 1px solid #30363d; background: #010409; color: white; font-size: 1rem; outline: none; box-sizing: border-box; }
        
        .flashcard { background: var(--card); padding: 50px 20px; border-radius: 25px; min-height: 220px; display: flex; flex-direction: column; justify-content: center; margin: 20px 0; border: 1px solid #30363d; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .word { font-size: 2.2rem; font-weight: bold; margin-bottom: 10px; }
        .translation { font-size: 1.8rem; color: var(--sec); min-height: 40px; font-weight: 500; }
        .counter { font-size: 0.9rem; color: #8b949e; margin-bottom: 10px; font-family: monospace; }
        .lang-hint { font-size: 0.7rem; color: #58a6ff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        
        /* List Styles */
        .list-container { text-align: left; background: var(--card); border-radius: 15px; margin: 20px 0; border: 1px solid #30363d; max-height: 400px; overflow-y: auto; }
        .list-item { padding: 12px 15px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; font-size: 0.9rem; }
        .pagination { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .page-btn { padding: 8px 12px; background: #21262d; border: 1px solid #30363d; color: white; border-radius: 6px; cursor: pointer; }
        .page-btn:disabled { opacity: 0.3; }

        .back { color: #8b949e; text-decoration: none; display: block; margin-top: 25px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div id="app">
    <div id="menu" class="screen active">
        <h1 style="color:white; font-weight:200; margin-bottom:40px;">Latvian Pro</h1>
        <button class="btn" onclick="checkAuth('add')">Add New Words</button>
        <button class="btn btn-dim" onclick="checkAuth('view')">View All Words</button>
        <button class="btn btn-sec" onclick="prepareSession('all')">Revise All Words</button>
        <button class="btn btn-sec" onclick="prepareSession(50)">Random 50 Words</button>
        <div id="status" style="margin-top:20px; font-size:0.8rem; color:#444;">Syncing with GitHub...</div>
    </div>

    <div id="add" class="screen">
        <h3>Database Update</h3>
        <input type="password" id="gh-token" placeholder="GitHub Token (Saved locally)">
        <hr style="border:0; border-top:1px solid #333; margin:20px 0;">
        <input type="text" id="eng" placeholder="English Word" autocomplete="off">
        <input type="text" id="lat" placeholder="Latvian Word" autocomplete="off">
        <button class="btn" id="saveBtn" onclick="saveToGitHub()">Upload to Cloud</button>
        <a href="#" class="back" onclick="location.reload()">← Back & Refresh</a>
    </div>

    <div id="view" class="screen">
        <h3>My Dictionary</h3>
        <div id="list-target" class="list-container"></div>
        <div class="pagination">
            <button class="page-btn" id="prevBtn" onclick="changePage(-1)">Prev</button>
            <span id="pageMeta" style="font-size:0.8rem;"></span>
            <button class="page-btn" id="nextBtn" onclick="changePage(1)">Next</button>
        </div>
        <a href="#" class="back" onclick="show('menu')">← Back to Menu</a>
    </div>

    <div id="practice" class="screen">
        <div id="count" class="counter">0 / 0</div>
        <div class="flashcard">
            <div id="dir-hint" class="lang-hint"></div>
            <div id="q-word" class="word">...</div>
            <div id="a-word" class="translation"></div>
        </div>
        <button id="rev-btn" class="btn" onclick="reveal()">Reveal Answer</button>
        <button id="next-btn" class="btn btn-sec" style="display:none" onclick="nextCard()">Next Word</button>
        <a href="#" class="back" onclick="show('menu')">Stop Session</a>
    </div>

    <div id="done" class="screen">
        <div class="flashcard">
            <h2 style="color: var(--sec);">Pabeigts! 🎉</h2>
            <p>Session Complete.</p>
        </div>
        <button class="btn" onclick="show('menu')">Home</button>
    </div>
</div>

<script>
    const REPO = "blessonbabys/my-vocab-db";
    const FILE = "words.json";
    const PASS = "latvian123";
    
    let words = [], session = [], idx = 0, currentSha = "";
    let currentPage = 1;
    const perPage = 100;

    window.onload = () => {
        const savedToken = localStorage.getItem('v_token');
        if(savedToken) document.getElementById('gh-token').value = savedToken;
        loadFromGitHub();
    };

    async function loadFromGitHub() {
        try {
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}?t=${Date.now()}`);
            const data = await res.json();
            currentSha = data.sha;
            words = JSON.parse(decodeURIComponent(escape(atob(data.content))));
            document.getElementById('status').innerText = `Database: ${words.length} words synced`;
        } catch(e) {
            document.getElementById('status').innerText = "Empty Database - Add words to start";
        }
    }

    function checkAuth(target) {
        if(prompt("Enter password:") === PASS) {
            if(target === 'view') { currentPage = 1; renderList(); }
            show(target);
        } else { alert("Wrong password"); }
    }

    function show(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // --- LIST LOGIC ---
    function renderList() {
        const container = document.getElementById('list-target');
        container.innerHTML = "";
        const start = (currentPage - 1) * perPage;
        const end = start + perPage;
        const pageData = words.slice().reverse().slice(start, end); // Newest first

        pageData.forEach(item => {
            const div = document.createElement('div');
            div.className = "list-item";
            div.innerHTML = `<span>${item.eng}</span><span style="color:var(--sec)">${item.lat}</span>`;
            container.appendChild(div);
        });

        document.getElementById('pageMeta').innerText = `Page ${currentPage} of ${Math.ceil(words.length/perPage) || 1}`;
        document.getElementById('prevBtn').disabled = currentPage === 1;
        document.getElementById('nextBtn').disabled = end >= words.length;
    }

    function changePage(dir) {
        currentPage += dir;
        renderList();
    }

    // --- SAVE LOGIC ---
    async function saveToGitHub() {
        const token = document.getElementById('gh-token').value.trim();
        const eng = document.getElementById('eng').value.trim();
        const lat = document.getElementById('lat').value.trim();
        
        if(!token || !eng || !lat) return alert("Fill all fields");
        localStorage.setItem('v_token', token);

        const btn = document.getElementById('saveBtn');
        btn.innerText = "Uploading..."; btn.disabled = true;

        const updated = [...words, { eng, lat }];

        try {
            const content = btoa(unescape(encodeURIComponent(JSON.stringify(updated, null, 2))));
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`, {
                method: "PUT",
                headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({ message: "Add word", content: content, sha: currentSha })
            });

            if(!res.ok) throw new Error("GitHub Error. Check token.");

            const resData = await res.json();
            currentSha = resData.content.sha;
            words = updated;

            document.getElementById('eng').value = "";
            document.getElementById('lat').value = "";
            btn.innerText = "Word Saved!";
            setTimeout(() => btn.innerText = "Upload to Cloud", 2000);
        } catch(e) { alert(e.message); } finally { btn.disabled = false; }
    }

    // --- PRACTICE LOGIC ---
    function prepareSession(limit) {
        if(words.length === 0) return alert("No words to revise!");
        session = [...words].sort(() => 0.5 - Math.random());
        if(limit === 50) session = session.slice(0, 50);
        idx = 0;
        show('practice');
        renderCard();
    }

    function renderCard() {
        const item = session[idx];
        const isEngPrompt = Math.random() > 0.5;
        document.getElementById('count').innerText = `${idx + 1} / ${session.length}`;
        document.getElementById('dir-hint').innerText = isEngPrompt ? "English → Latvian" : "Latvian → English";
        document.getElementById('q-word').innerText = isEngPrompt ? item.eng : item.lat;
        document.getElementById('a-word').innerText = "";
        document.getElementById('a-word').dataset.answer = isEngPrompt ? item.lat : item.eng;
        document.getElementById('rev-btn').style.display = "block";
        document.getElementById('next-btn').style.display = "none";
    }

    function reveal() {
        const el = document.getElementById('a-word');
        el.innerText = el.dataset.answer;
        document.getElementById('rev-btn').style.display = "none";
        document.getElementById('next-btn').style.display = "block";
    }

    function nextCard() {
        idx++;
        if(idx < session.length) renderCard();
        else show('done');
    }
</script>
</body>
</html>
