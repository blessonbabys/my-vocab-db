<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Latvian Pro Sync</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --text: #c9d1d9; --accent: #58a6ff; --sec: #3fb950; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; align-items: center; }
        #app { width: 100%; max-width: 400px; text-align: center; }
        .screen { display: none; animation: fadeIn 0.3s; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .btn { background: var(--card); border: 1px solid #30363d; color: var(--accent); padding: 18px; border-radius: 12px; width: 100%; font-size: 1.1rem; margin-bottom: 12px; cursor: pointer; font-weight: 600; }
        .btn-sec { color: var(--sec); border-color: #30363d; }
        input { width: 100%; padding: 16px; margin-bottom: 12px; border-radius: 10px; border: 1px solid #30363d; background: #010409; color: white; box-sizing: border-box; font-size: 1rem; outline: none; }
        .flashcard { background: var(--card); padding: 50px 20px; border-radius: 20px; min-height: 220px; display: flex; flex-direction: column; justify-content: center; margin: 20px 0; border: 1px solid #30363d; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .word { font-size: 2.2rem; font-weight: bold; }
        .translation { font-size: 1.8rem; color: var(--sec); margin-top: 20px; min-height: 40px; }
        .counter { font-size: 0.9rem; color: #8b949e; margin-bottom: 10px; font-family: monospace; }
        .back { color: #8b949e; text-decoration: none; display: block; margin-top: 25px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div id="app">
    <div id="menu" class="screen active">
        <h1 style="color:white; font-weight:200;">Latvian Pro</h1>
        <button class="btn" onclick="show('add')">Add Words</button>
        <button class="btn btn-sec" onclick="startPractice()">Revise Words</button>
        <div id="status" style="margin-top:20px; font-size:0.8rem; color:#444;">Connecting...</div>
    </div>

    <div id="add" class="screen">
        <h3>Cloud Sync</h3>
        <input type="password" id="gh-token" placeholder="Paste GitHub Token">
        <input type="text" id="eng" placeholder="English Word" autocomplete="off">
        <input type="text" id="lat" placeholder="Latvian Word" autocomplete="off">
        <button class="btn" id="saveBtn" onclick="saveToGitHub()">Upload to GitHub</button>
        <a href="#" class="back" onclick="location.reload()">← Back & Sync</a>
    </div>

    <div id="practice" class="screen">
        <div id="count" class="counter">0 / 0</div>
        <div class="flashcard">
            <div id="lang-label" style="font-size:0.75rem; color:#8b949e; margin-bottom:15px; text-transform:uppercase;"></div>
            <div id="main-word" class="word">...</div>
            <div id="sub-word" class="translation"></div>
        </div>
        <button id="rev-btn" class="btn" onclick="reveal()">Reveal</button>
        <button id="next-btn" class="btn btn-sec" style="display:none" onclick="next()">Next</button>
        <a href="#" class="back" onclick="show('menu')">Exit</a>
    </div>
</div>

<script>
    const REPO = "blessonbabys/my-vocab-db";
    const FILE = "words.json";
    
    let words = [], session = [], idx = 0, currentSha = "";

    // Auto-load token if saved
    window.onload = () => {
        const saved = localStorage.getItem('vocab_token');
        if(saved) document.getElementById('gh-token').value = saved;
        loadData();
    };

    async function loadData() {
        try {
            // Fetch file info (SHA and Content)
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}?t=${Date.now()}`);
            const data = await res.json();
            currentSha = data.sha;
            words = JSON.parse(decodeURIComponent(escape(atob(data.content))));
            document.getElementById('status').innerText = `Database: ${words.length} words`;
        } catch(e) {
            document.getElementById('status').innerText = "Empty Database";
        }
    }

    function show(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    async function saveToGitHub() {
        const token = document.getElementById('gh-token').value.trim();
        const eng = document.getElementById('eng').value.trim();
        const lat = document.getElementById('lat').value.trim();
        
        if(!token || !eng || !lat) return alert("Missing info");
        localStorage.setItem('vocab_token', token);

        const btn = document.getElementById('saveBtn');
        btn.innerText = "Uploading...";
        btn.disabled = true;

        const updated = [...words, { eng, lat }];

        try {
            const content = btoa(unescape(encodeURIComponent(JSON.stringify(updated, null, 2))));
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`, {
                method: "PUT",
                headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({ message: "Add word", content: content, sha: currentSha })
            });

            if(!res.ok) throw new Error("Sync Failed");

            const resData = await res.json();
            currentSha = resData.content.sha;
            words = updated;

            document.getElementById('eng').value = "";
            document.getElementById('lat').value = "";
            btn.innerText = "Saved!";
            setTimeout(() => btn.innerText = "Upload to GitHub", 2000);
        } catch(e) {
            alert(e.message);
        } finally {
            btn.disabled = false;
        }
    }

    function startPractice() {
        if(words.length === 0) return;
        session = [...words].sort(() => 0.5 - Math.random());
        idx = 0;
        show('practice');
        render();
    }

    function render() {
        const item = session[idx];
        const isEng = Math.random() > 0.5;
        document.getElementById('count').innerText = `${idx + 1} / ${session.length}`;
        document.getElementById('lang-label').innerText = isEng ? "English → Latvian" : "Latvian → English";
        document.getElementById('main-word').innerText = isEng ? item.eng : item.lat;
        document.getElementById('sub-word').innerText = "";
        document.getElementById('sub-word').dataset.ans = isEng ? item.lat : item.eng;
        document.getElementById('rev-btn').style.display = "block";
        document.getElementById('next-btn').style.display = "none";
    }

    function reveal() {
        document.getElementById('sub-word').innerText = document.getElementById('sub-word').dataset.ans;
        document.getElementById('rev-btn').style.display = "none";
        document.getElementById('next-btn').style.display = "block";
    }

    function next() {
        idx++;
        if(idx < session.length) render();
        else show('menu');
    }
</script>
</body>
</html>
